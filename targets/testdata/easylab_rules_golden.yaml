# easysidecar default egress policy (managed by easylab).
rules:
  - match: ["registry-1.docker.io", "docker.io", "index.docker.io"]
    action: rewrite
    target: "gw:80"
  - match: ["ghcr.io", "quay.io", "gcr.io", "registry.k8s.io", "mcr.microsoft.com", "public.ecr.aws", "nvcr.io"]
    action: rewrite
    target: "gw:80"
  - match: ["production.cloudflare.docker.com", "*.cloudflarestorage.com"]
    action: rewrite
    target: "gw:80"
  - match: ["registry.npmjs.org", "*.npmjs.org"]
    action: rewrite
    target: "gw:80"
  - match: ["npm.jsr.io"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/npm"
  - match: ["pypi.org", "files.pythonhosted.org"]
    action: rewrite
    target: "gw:80"
  - match: ["proxy.golang.org", "sum.golang.org"]
    action: rewrite
    target: "gw:80"
  - match: ["crates.io", "index.crates.io", "static.crates.io"]
    action: rewrite
    target: "gw:80"
  - match: ["repo.maven.apache.org"]
    action: rewrite
    target: "gw:80"
  - match: ["dl.google.com"]
    action: rewrite
    target: "gw:80"
    strip_prefix: "/dl/android/maven2"
    add_prefix: "/artifacts/maven"
  - match: ["plugins.gradle.org"]
    action: rewrite
    target: "gw:80"
    strip_prefix: "/m2"
    add_prefix: "/artifacts/maven"
  - match: ["repo.clojars.org"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/maven"
  - match: ["repo.spring.io"]
    action: rewrite
    target: "gw:80"
    strip_prefix: "/release"
    add_prefix: "/artifacts/maven"
  - match: ["jitpack.io"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/maven"
  - match: ["api.nuget.org", "azuresearch-usnc.nuget.org"]
    action: rewrite
    target: "gw:80"
  - match: ["rubygems.org", "index.rubygems.org"]
    action: rewrite
    target: "gw:80"
  - match: ["repo.packagist.org"]
    action: rewrite
    target: "gw:80"
  - match: ["repo.hex.pm"]
    action: rewrite
    target: "gw:80"
  - match: ["hex.pm", "api.hex.pm"]
    action: rewrite
    target: "gw:80"
  - match: ["pub.dev"]
    action: rewrite
    target: "gw:80"
  - match: ["charts.helm.sh"]
    action: rewrite
    target: "gw:80"
  - match: ["center.conan.io", "center2.conan.io"]
    action: rewrite
    target: "gw:80"
  - match: ["api.spm.swift.org"]
    action: rewrite
    target: "gw:80"
  - match: ["dl-cdn.alpinelinux.org"]
    action: rewrite
    target: "gw:80"
  - match: ["deb.debian.org", "security.debian.org"]
    action: rewrite
    target: "gw:80"
  - match: ["archive.ubuntu.com", "security.ubuntu.com"]
    action: rewrite
    target: "gw:80"
  - match: ["*.elrepo.org", "mirror.stream.centos.org", "dl.fedoraproject.org"]
    action: rewrite
    target: "gw:80"
  - match: ["huggingface.co", "*.huggingface.co", "cdn-lfs.huggingface.co"]
    action: rewrite
    target: "gw:80"
  - match: ["repo.anaconda.com", "conda.anaconda.org"]
    action: rewrite
    target: "gw:80"
  - match: ["cache.nixos.org"]
    action: rewrite
    target: "gw:80"
  - match: ["github.com", "codeload.github.com"]
    action: rewrite
    target: "gw:80"
  - match: ["repo.scala-sbt.org", "scala.jfrog.io"]
    action: rewrite
    target: "gw:80"
  - match: ["hackage.haskell.org"]
    action: rewrite
    target: "gw:80"
  - match: ["cran.r-project.org"]
    action: rewrite
    target: "gw:80"
  - match: ["cpan.metacpan.org"]
    action: rewrite
    target: "gw:80"
  - match: ["luarocks.org"]
    action: rewrite
    target: "gw:80"
  - match: ["pkg.julialang.org", "*.pkg.julialang.org"]
    action: rewrite
    target: "gw:80"
  - match: ["jsr.io"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/jsr"
  - match: ["opam.ocaml.org"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/opam"
  - match: ["stackage.org"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/stackage"
  - match: ["pecl.php.net"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/pecl"
  - match: ["bcr.bazel.build"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/bazel"
  - match: ["updates.jenkins.io"]
    action: rewrite
    target: "gw:80"
    add_prefix: "/artifacts/jenkins"
default: direct
mitm_default: false
